owner: ""            # optional GitHub owner filter (login); also picks the App installation when there are several
includeRepos: []     # optional explicit repos, e.g. ["user/repo1", "org/repo2"]
excludeRepos: []     # optional exclusions
pollSeconds: 30
maxLaunchPerCycle: 2
runnerIdleTimeoutMinutes: 15
runnerMaxRestarts: 20
requiredLabels:
  - self-hosted
  - orchestrated
windowsLabelRegex: (?i)windows
linuxLabelRegex: (?i)linux
namespace: ""        # namespace for runner Jobs; defaults to RUNNER_NAMESPACE or the pod's own namespace
runnerTemplates:     # Job manifests per platform; omit a platform to disable it
  linux: ./runner-linux.yaml
  windows: ./runner-windows.yaml
# GitHub App credentials come from the environment, not this file:
#   GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY_PATH, GITHUB_APP_INSTALLATION_ID (optional)
