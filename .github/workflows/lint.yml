name: Lint
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  actions:
    name: GitHub Actions
    runs-on: ubuntu-latest
    concurrency:
      group: lint-${{ github.ref }}
    permissions:
      contents: read # Read workflow files
      pull-requests: write # For review permission
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        uses: kjanat/actionlint@08bb2c4f0d039744455b87aef1c647fb8b66d37b # v1.17.0
        with:
          review: true
          
