name: Build and Test

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'renovate.json'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'renovate.json'
  release:
    types: [ published ]
  schedule:
    - cron: '42 4 * * *'
  workflow_dispatch:
    inputs:
      bump-docker-dind:
        description: 'Bump and release docker-dind chart'
        type: boolean
        required: false

concurrency: 
  cancel-in-progress: true
  group: build-${{ github.workflow_sha }}-${{ github.ref }}

env:
  RUNNER_IDLE_TIMEOUT_MINUTES: ${{ vars.RUNNER_IDLE_TIMEOUT_MINUTES || '5' }}
  RUNNER_MAX_RESTARTS: ${{ vars.RUNNER_MAX_RESTARTS || '2' }}
  DOCKER_REPO: ghcr.io/${{ github.repository }}/
  DOCKER_RELEASE_PREFIX_OPT: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}${{ github.event_name == 'release' && '-' || '' }}

jobs:
  registration-token:
    name: Create Registration Token
    runs-on: ubuntu-latest
    environment: registration
    permissions:
      contents: read
    outputs:
      reg_token: ${{ steps.encoded-reg-token.outputs.out }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create registration token
        id: token
        shell: bash
        run: |
          if [ -z "${{ secrets.REGISTRATION_PAT }}" ]; then
            echo "REGISTRATION_PAT secret missing" >&2
            exit 1
          fi
          token=$(pwsh -Command ". ./registration.ps1; New-RegistrationToken -PatToken '${{ secrets.REGISTRATION_PAT }}' -RepoFullName '${{ github.repository }}'")
          echo "::add-mask::$token"
          if [ -z "$token" ]; then
            echo "Failed to create registration token" >&2
            exit 1
          fi
          echo "reg_token=$token" >> "$GITHUB_OUTPUT"

      - name: Encode registration token
        id: encoded-reg-token
        shell: pwsh
        env:
          SECRET: ${{ secrets.SYM_ENC }}
          IN: ${{ steps.token.outputs.reg_token }}
        run: |
          $plain = $env:IN
          if (-not $plain) { throw "IN payload missing" }
          $key = [System.Security.Cryptography.SHA256]::HashData([System.Text.Encoding]::UTF8.GetBytes($env:SECRET))
          $aes = [System.Security.Cryptography.Aes]::Create()
          $aes.Mode = 'CBC'
          $aes.Padding = 'PKCS7'
          $aes.Key = $key
          $aes.GenerateIV()
          $encryptor = $aes.CreateEncryptor()
          $plainBytes = [System.Text.Encoding]::UTF8.GetBytes($plain)
          $cipher = $encryptor.TransformFinalBlock($plainBytes, 0, $plainBytes.Length)
          $payload = $aes.IV + $cipher
          $out = [Convert]::ToBase64String($payload)
          "out=$out" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  build-runner:
    name: Build and Test Runner (${{ matrix.context }})
    needs: registration-token
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - context: linux
            platform: linux
            tag: ubuntu
            registry: runner
            buildkit: true
            test: true
          - context: windows
            platform: windows
            tag: windows
            registry: runner
            buildkit: false
            test: true
    uses: ./.github/workflows/_build-runner.yml
    with:
      context: ${{ matrix.context }}
      platform: ${{ matrix.platform }}
      tag: ${{ matrix.tag }}
      registry: ${{ matrix.registry }}
      buildkit: ${{ matrix.buildkit }}
      test: ${{ matrix.test }}
      reg_token: ${{ needs.registration-token.outputs.reg_token }}
      run_id: ${{ github.run_id }}
    secrets:
      SYM_ENC: ${{ secrets.SYM_ENC }}

  build-docker:
    name: Build Docker Image (${{ matrix.context }})
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - context: docker-dind
            platform: windows
            tag: windows
            registry: docker-dind
            buildkit: false
            test: false
          - context: .
            platform: linux
            tag: latest
            registry: watcher
            buildkit: true
            test: false
          # Future images can be added here:
          # - context: some-other-tool
          #   platform: linux
          #   tag: latest
          #   registry: some-tool
          #   buildkit: true
          #   test: true
    uses: ./.github/workflows/_build-docker.yml
    with:
      context: ${{ matrix.context }}
      platform: ${{ matrix.platform }}
      tag: ${{ matrix.tag }}
      registry: ${{ matrix.registry }}
      buildkit: ${{ matrix.buildkit }}
      test: ${{ matrix.test }}
      run_id: ${{ github.run_id }}

  cancel-on-failure:
    name: Cancel on Build Failure
    needs: [build-runner, build-docker]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cancel workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }}

  test:
    name: Integrated Runner Test
    needs: registration-token
    environment: testing
    permissions:
      contents: none
    strategy:
      matrix:
        include:
          - platform: linux
          - platform: windows
    runs-on:
      - self-hosted
      - ${{ matrix.platform }}
      - run-${{ github.run_id }}
    timeout-minutes: 5
    steps:
      - run: echo "Self-hosted runner alive on ${{ matrix.platform }}"

  merge:
    name: Merge Manifest
    needs: [build-runner, test]
    if: github.event_name == 'release' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || 'latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Merge multi-platform images
        run: |
          docker buildx imagetools create \
            -t ${{ env.DOCKER_REPO }}runner:${{ env.DOCKER_TAG }} \
            ${{ env.DOCKER_REPO }}runner:${{ env.DOCKER_RELEASE_PREFIX_OPT }}ubuntu \
            ${{ env.DOCKER_REPO }}runner:${{ env.DOCKER_RELEASE_PREFIX_OPT }}windows

  tag:
    name: Additional Tagging
    needs: build-docker
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERD_VERSION: 28.5.2
    outputs:
      docker_dind_digest: ${{ steps.get-digest.outputs.digest }}
      docker_dind_digest_changed: ${{ steps.get-digest.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check existing digest
        id: existing-digest
        env:
          DOCKER_TAG: ${{ github.event_name == 'release' && env.DOCKERD_VERSION || 'latest' }}
        run: |
          EXISTING_DIGEST=$(docker buildx imagetools inspect "${{ env.DOCKER_REPO }}docker-dind:${{ env.DOCKER_TAG }}" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)
          if [ -n "$EXISTING_DIGEST" ]; then
            echo "Existing digest: $EXISTING_DIGEST"
            echo "digest=$EXISTING_DIGEST" >> $GITHUB_OUTPUT
          else
            echo "No existing image found"
            echo "digest=" >> $GITHUB_OUTPUT
          fi

      - name: Tag docker-dind image
        env:
          DOCKER_TAG: ${{ github.event_name == 'release' && env.DOCKERD_VERSION || 'latest' }}
        run: |
          docker buildx imagetools create \
            -t "${{ env.DOCKER_REPO }}docker-dind:${{ env.DOCKER_TAG }}" \
            "${{ env.DOCKER_REPO }}docker-dind:${{ env.DOCKER_RELEASE_PREFIX_OPT }}windows"

      - name: Get docker-dind image digest
        id: get-digest
        env:
          DOCKER_TAG: ${{ github.event_name == 'release' && env.DOCKERD_VERSION || 'latest' }}
        run: |
          NEW_DIGEST=$(docker buildx imagetools inspect "${{ env.DOCKER_REPO }}docker-dind:${{ env.DOCKER_TAG }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "New digest: $NEW_DIGEST"
          echo "digest=$NEW_DIGEST" >> $GITHUB_OUTPUT
          
          if [ "${{ steps.existing-digest.outputs.digest }}" != "$NEW_DIGEST" ]; then
            if [ -n "${{ steps.existing-digest.outputs.digest }}" ]; then
              echo "Digest changed from ${{ steps.existing-digest.outputs.digest }}"
            else
              echo "New image created"
            fi
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "Digest unchanged"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  lint-charts:
    name: Test Helm Charts
    runs-on: ubuntu-latest
    needs: build-docker
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          check-latest: true

      - name: Set up chart testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart linting
        run: ct lint ${{ github.event != 'pull_request' && '--all' }}

  test-watcher:
    name: Test Runner Watcher
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      - name: Install chart and launch runner Jobs
        shell: pwsh
        run: .github/scripts/test-watcher.ps1

  release-charts:
    name: Release Helm Charts
    needs: 
      - lint-charts
      - tag
    if: ((github.event_name == 'push' || github.event_name == 'schedule') && needs.tag.outputs.docker_dind_digest_changed == 'true') || (github.event_name == 'workflow_dispatch' && github.event.inputs['bump-docker-dind'] == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: connect
    env:
      CR_PASSPHRASE_FILE: ${{ vars.CR_KEYDIR }}/passphrase
      CR_KEYRING: ${{ vars.CR_KEYDIR }}/secring.gpg
      TEMP_BRANCH_REF: refs/heads/tmp/docker-dind-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1

      - name: Load Secrets
        uses: 1password/load-secrets-action@13f58eec611f8e5db52ec16247f58c508398f3e6 # v3.0.0
        id: load-secrets
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CR_KEYFILE: ${{ vars.CR_KEYFILE }}
          CR_PASSPHRASE: ${{ vars.CR_PASSPHRASE }}

      - name: Prepare GPG Keyring
        run: |
          mkdir -pv ${{ vars.CR_KEYDIR }}
          base64 -d <<< "${{ steps.load-secrets.outputs.CR_KEYFILE }}" > "${{ env.CR_KEYRING }}"
          echo "${{ steps.load-secrets.outputs.CR_PASSPHRASE }}" > "${{ env.CR_PASSPHRASE_FILE }}"

      - name: Install yq
        run: |
          if ! command -v yq &> /dev/null; then
            pip install yq
          fi

      - name: Extract Latest Git Tag
        uses: oprypin/find-latest-tag@6957ac556fa6d349727ecabfcaaf9f8e5ee37124 # v1.1.3
        id: git-version
        with:
          repository: ${{ github.repository }}
          prefix: docker-dind-

      - name: Determine Prerelease Version
        id: prerelease-version
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const tag = '${{ steps.git-version.outputs.tag }}'.replace('docker-dind-', '');
            const semverRegex = /^(\d+)\.(\d+)\.(\d+)(?:-([a-zA-Z]+)\.(\d+))?$/;
            const match = tag.match(semverRegex);
            if (!match) {
              core.setFailed(`Invalid semver: ${tag}`);
              return;
            }
            const [, major, minor, patch, preLabel, preNum] = match;
            let newVersion;
            if (preLabel === 'dev') {
              newVersion = `${major}.${minor}.${patch}-dev.${parseInt(preNum, 10) + 1}`;
            } else if (preLabel) {
              newVersion = `${major}.${minor}.${parseInt(patch, 10) + 1}-dev.0`;
            } else {
              newVersion = `${major}.${minor}.${parseInt(patch, 10) + 1}-dev.0`;
            }
            core.info(`Bumped ${tag} -> ${newVersion}`);
            core.setOutput('new_version', newVersion);

      - name: Determine Release Version
        id: release-version
        if: github.event.inputs['bump-docker-dind'] == 'true'
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1.11.0
        with:
          token: ${{ github.token }}
          prefix: docker-dind-
          noNewCommitBehavior: warn
          scopeList: docker-dind,docker,dind
          minorList: feat, feature, refactor
          patchList: fix, perf, build, test, tests
          skipInvalidTags: true

      - name: Patch values.yaml
        shell: bash
        run: |
          yq eval -i ".image.tag = \"@${{ needs.tag.outputs.docker_dind_digest }}\"" charts/docker-dind/values.yaml
          echo "Patched values.yaml with digest: ${{ needs.tag.outputs.docker_dind_digest }}"

      - name: Patch Chart.yaml
        shell: bash
        id: patch-chart
        env:
          TARGET_VERSION: ${{ github.event.inputs['bump-docker-dind'] == 'true' && steps.release-version.outputs.nextStrict || steps.prerelease-version.outputs.new_version }}
        run: |
          yq eval -i ".version = \"${{ env.TARGET_VERSION }}\"" charts/docker-dind/Chart.yaml
          echo "version=${{ env.TARGET_VERSION }}" >> $GITHUB_OUTPUT
          echo "Patched Chart.yaml to version ${{ env.TARGET_VERSION }}"

      - name: Create Temporary Branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/git/refs \
            -f ref="${{ env.TEMP_BRANCH_REF }}" \
            -f sha="$(git rev-parse HEAD)"

      - name: Commit and Push Changes
        uses: iarekylew00t/verified-bot-commit@d7e8eea1f154881e1f9d70a3fd933e740148b7f4 # v2.1.1
        with:
          message: 'chore(chart): bump docker-dind chart to ${{ steps.patch-chart.outputs.version }}'
          ref: ${{ env.TEMP_BRANCH_REF }}
          files: |
            charts/docker-dind/*.yaml

      - name: Tag and Release Charts
        uses: helm/chart-releaser-action@a917fd15b20e8b64b94d9158ad54cd6345335584 # v1.6.0
        with:
          charts_dir: charts
          config: cr.yaml
          mark_as_latest: false
          skip_existing: false
        env:
          CR_TOKEN: ${{ github.token }}
          CR_SIGN: true

      - name: Delete temp branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TMP_BRANCH: tmp/chart-bump-${{ github.run_id }}
        run: |
          gh api -X DELETE repos/${{ github.repository }}/git/${{ env.TEMP_BRANCH_REF }}

  complete:
    name: Complete Workflow
    needs:
      - cleanup-runners
      - build-runner
      - build-docker
      - lint-charts
      - merge
      - tag
      - release-charts
    if: always()
    environment: completion
    runs-on: ubuntu-latest
    permissions:
      contents: none
    steps:
      - name: Check dependent job results
        shell: bash
        run: |
          # Fail only on explicit failures/cancellations, ignore skipped jobs
          if [ "${{ needs.build-runner.result }}" = "failure" ] || [ "${{ needs.build-runner.result }}" = "cancelled" ]; then
            echo "build-runner -> ${{ needs.build-runner.result }}"
            exit 1
          fi
          if [ "${{ needs.build-docker.result }}" = "failure" ] || [ "${{ needs.build-docker.result }}" = "cancelled" ]; then
            echo "build-docker -> ${{ needs.build-docker.result }}"
            exit 1
          fi
          if [ "${{ needs.lint-charts.result }}" = "failure" ] || [ "${{ needs.lint-charts.result }}" = "cancelled" ]; then
            echo "lint-charts -> ${{ needs.lint-charts.result }}"
            exit 1
          fi
          if [ "${{ needs.merge.result }}" = "failure" ] || [ "${{ needs.merge.result }}" = "cancelled" ]; then
            echo "merge -> ${{ needs.merge.result }}"
            exit 1
          fi
          if [ "${{ needs.tag.result }}" = "failure" ] || [ "${{ needs.tag.result }}" = "cancelled" ]; then
            echo "tag -> ${{ needs.tag.result }}"
            exit 1
          fi
          if [ "${{ needs.release-charts.result }}" = "failure" ] || [ "${{ needs.release-charts.result }}" = "cancelled" ]; then
            echo "release-charts -> ${{ needs.release-charts.result }}"
            exit 1
          fi
          if [ "${{ needs.cleanup-runners.result }}" = "failure" ] || [ "${{ needs.cleanup-runners.result }}" = "cancelled" ]; then
            echo "cleanup-runners -> ${{ needs.cleanup-runners.result }}"
            exit 1
          fi
          echo "No failed dependents (skipped jobs ignored)."

  cleanup-runners:
    name: Cleanup Runners
    needs: [build-runner, test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: registration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Delete self-hosted runners for this run
        shell: pwsh
        env:
          PAT_TOKEN: ${{ secrets.REGISTRATION_PAT }}
          RUNNER_NAMES: "test-${{ github.run_id }}-linux,test-${{ github.run_id }}-windows"
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          if (-not $env:PAT_TOKEN) { throw "PAT_TOKEN (REGISTRATION_PAT) is required for cleanup." }
          ./cleanup-runners.ps1 -RepoFullName $env:REPO_FULL_NAME -PatToken $env:PAT_TOKEN -RunnerNames ($env:RUNNER_NAMES -split ",")
