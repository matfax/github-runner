services:
  cache-server:
    image: ghcr.io/falcondev-oss/github-actions-cache-server:latest@sha256:3999b0202ec509f3b2084ef92cc50b408838e0d442b5997dd6dff2d89f4fe7b4
    ports:
      - '3000:3000'
    environment:
      API_BASE_URL: http://localhost:3000
      CACHE_CLEANUP_OLDER_THAN_DAYS: '30'
    volumes:
      - cache-data:/app/.data

volumes:
  cache-data: