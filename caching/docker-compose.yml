services:
  cache-server:
    image: ghcr.io/falcondev-oss/github-actions-cache-server:latest@sha256:14967d184978de7a6b5a96dca0dc5bcb250b6bd83d664effed4d10c5b1412c6e
    ports:
      - '3000:3000'
    environment:
      API_BASE_URL: http://localhost:3000
      CACHE_CLEANUP_OLDER_THAN_DAYS: '30'
    volumes:
      - cache-data:/app/.data

volumes:
  cache-data: