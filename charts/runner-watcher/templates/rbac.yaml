{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "runner-watcher.serviceAccountName" . }}
  labels:
    {{- include "runner-watcher.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "runner-watcher.fullname" . }}
  labels:
    {{- include "runner-watcher.labels" . | nindent 4 }}
rules:
  # Launch runner Jobs and check whether one is still running per repo/platform
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create"]
  # Per-Job registration-token Secrets, owned by their Job once created
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "runner-watcher.fullname" . }}
  labels:
    {{- include "runner-watcher.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "runner-watcher.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "runner-watcher.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
