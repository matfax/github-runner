{{- if .Values.cache.enabled -}}
{{- if and .Values.cache.persistence.enabled (not .Values.cache.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "runner-watcher.cacheName" . }}
  labels:
    {{- include "runner-watcher.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
spec:
  accessModes:
    - {{ .Values.cache.persistence.accessMode }}
  {{- with .Values.cache.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.cache.persistence.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "runner-watcher.cacheName" . }}
  labels:
    {{- include "runner-watcher.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.cache.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "runner-watcher.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: cache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "runner-watcher.cacheName" . }}
  labels:
    {{- include "runner-watcher.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "runner-watcher.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cache
  template:
    metadata:
      labels:
        {{- include "runner-watcher.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cache
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      {{- with .Values.cache.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cache.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cache-server
          image: {{ include "runner-watcher.image" .Values.cache.image | quote }}
          imagePullPolicy: {{ .Values.cache.image.pullPolicy }}
          env:
            - name: API_BASE_URL
              value: {{ include "runner-watcher.cacheUrl" . | quote }}
            - name: CACHE_CLEANUP_OLDER_THAN_DAYS
              value: {{ .Values.cache.cleanupOlderThanDays | quote }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.cache.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/.data
      volumes:
        - name: data
          {{- if .Values.cache.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.cache.persistence.existingClaim | default (include "runner-watcher.cacheName" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
