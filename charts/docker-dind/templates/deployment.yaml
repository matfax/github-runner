{{- include "docker-dind.validateTLS" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "docker-dind.fullname" . }}
  labels:
    {{- include "docker-dind.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "docker-dind.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "docker-dind.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "docker-dind.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        windowsOptions:
          hostProcess: true
          runAsUserName: "NT AUTHORITY\\SYSTEM"
      hostNetwork: true
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}{{ if (hasPrefix "@" .Values.image.tag) }}{{ .Values.image.tag }}{{ else }}:{{ .Values.image.tag | default (regexReplaceAllLiteral "^v" .Chart.AppVersion "") }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["powershell"]
          args: ["-NoProfile", "-Command", "& (Join-Path $env:CONTAINER_SANDBOX_MOUNT_POINT 'start.ps1')"]
          ports:
            - name: docker-tls
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: FIREWALL_ENABLED
              value: {{ .Values.firewall.enabled | quote }}
            - name: FIREWALL_REQUIRED
              value: {{ .Values.firewall.required | quote }}
            - name: FIREWALL_POD_CIDR
              value: {{ .Values.firewall.podCIDR | quote }}
            - name: FIREWALL_NODE_CIDR
              value: {{ .Values.firewall.nodeCIDR | quote }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: docker-config
              mountPath: C:/docker-config-k8s
            - name: tls-server
              mountPath: C:/dind-tls/server
              readOnly: true
            - name: tls-client-ca
              mountPath: C:/dind-tls/client-ca
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: docker-data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
      volumes:
        - name: docker-config
          configMap:
            name: {{ include "docker-dind.fullname" . }}
        # Mounted without subPath so renewed certificates reach the running gateway
        - name: tls-server
          secret:
            secretName: {{ include "docker-dind.tlsSecretName" . }}
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: tls-client-ca
          secret:
            secretName: {{ include "docker-dind.clientCASecretName" . }}
            items:
              - key: {{ .Values.tls.clientCA.key }}
                path: ca.crt
        {{- if .Values.persistence.enabled }}
        - name: docker-data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "docker-dind.fullname" .) }}
        {{- end }}
